name: Build and Deploy .NET Application  

on:  
  push:  
    branches: [staging]  

jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v3  
        name: Checkout code  

      - name: Setup .NET  
        uses: actions/setup-dotnet@v3  
        with:  
          dotnet-version: "9.0.x"  

      - name: Restore dependencies  
        run: dotnet restore  

      - name: Build  
        run: dotnet build --configuration Release --no-restore  

      - name: Publish  
        run: dotnet publish --configuration Release --no-restore --output publish  

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: publish/

  deploy-ftp:  
    runs-on: ubuntu-latest  
    needs: build
    if: false # Disabled FTP deployment in favor of EC2 deployment
    steps:  
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: publish

      - name: Deploy for staging  
        if: github.ref == 'refs/heads/staging'  
        uses: SamKirkland/FTP-Deploy-Action@4.2.0  
        with:  
          server: ${{ secrets.STAGING_FTP_SERVER }}  
          username: ${{ secrets.STAGING_FTP_USERNAME }}  
          password: ${{ secrets.STAGING_FTP_PASSWORD }}  
          local-dir: publish/  
          server-dir: /  
          exclude: |  
            **/.git*  
            **/.git*/**  
            **/node_modules/**  
            web.config
            
  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ec2-user@${{ secrets.EC2_HOST }} \
          "cd VaccineAPI && \
          git pull && \
          docker-compose down && \
          docker-compose build --no-cache && \
          docker-compose up -d"
          
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/ec2_key.pem ec2-user@${{ secrets.EC2_HOST }} \
          "docker ps | grep vaccineapi-api"