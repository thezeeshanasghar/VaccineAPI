version: '3.8'

services:
  vaccineapi:
    build: .
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - db
    volumes:
      - ./certs:/app/certs
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_HTTPS_PORT=443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/certs/myapi.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Ae!8bfb666

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mcs@12345@12345
      MYSQL_DATABASE: skint__stagedb
      MYSQL_USER: skint__stagedb
      MYSQL_PASSWORD: mcs@12345
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: mcs@12345@12345
    ports:
      - "8081:80"

volumes:
  db_data: