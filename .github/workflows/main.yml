name: Build and Deploy .NET Application

on:
  push:
    branches: [staging, master]
  workflow_dispatch: # Allows manual triggering via a button
    inputs:
      deploy_env:
        description: 'Select the environment to deploy (staging or master)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'master'

jobs:
  build-and-deploy:
    runs-on: windows-latest # Use a Windows runner to build .NET project

    steps:
      - uses: actions/checkout@v2
        name: Checkout code

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "6.0" # Specify your .NET version here

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-restore --output publish

      - name: Deploy for staging
        if: github.ref == 'refs/heads/staging' || github.event.inputs.deploy_env == 'staging'
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.STAING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAING_FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            web.config

      - name: Deploy for master
        if: github.ref == 'refs/heads/master' || github.event.inputs.deploy_env == 'master'
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PRD_FTP_USERNAME }}
          password: ${{ secrets.PRD_FTP_PASSWORD }}
          local-dir: publish/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            web.config

