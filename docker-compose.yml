services:
  vaccineapi:
    build: .
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./certs:/app/certs
      - ./Resources:/app/Resources
    environment:
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_HTTPS_PORT=443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/certs/myapi.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Ae!8bfb666
      - DefaultDBConnection=server=db;userid=skint__stagedb;password=mcs@12345;database=skint__stagedb;port=3306

  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    environment:
      MYSQL_ROOT_PASSWORD: mcs@12345
      MYSQL_DATABASE: skint__stagedb
      MYSQL_USER: skint__stagedb
      MYSQL_PASSWORD: mcs@12345
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5

  phpmyadmin:
    image: bitnami/phpmyadmin:latest
    platform: linux/arm64/v8
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      MYSQL_ROOT_PASSWORD: mcs@12345
    ports:
      - "8081:8080"

volumes:
  db_data: